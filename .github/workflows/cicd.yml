name: "CI/CD: test then deploy"

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:
concurrency:
  group: cicd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Smoke check (compile)
        run: |
          python -m compileall -q .

  deploy:
    needs: [test]
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare SSH
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          # Use OpenSSH client directly (avoids key-format parsing issues in some SCP/SSH actions).
          # Add a trailing newline (some SSH tools are picky about missing final newline).
          printf "%s\n" "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          sed -i 's/\r$//' ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          echo "Key file sanity (safe):"
          echo "  first: $(head -n 1 ~/.ssh/deploy_key)"
          echo "  last : $(tail -n 1 ~/.ssh/deploy_key)"
          echo "  lines: $(wc -l < ~/.ssh/deploy_key)  bytes: $(wc -c < ~/.ssh/deploy_key)"

          # Trust the server host key for this run (prevents interactive prompt).
          ssh-keyscan -p "${{ secrets.VPS_PORT || 22 }}" -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

          echo "Key fingerprint (sanity check):"
          ssh-keygen -yf ~/.ssh/deploy_key | ssh-keygen -lf -

          echo "SSH auth check:"
          ssh -o IdentitiesOnly=yes -i ~/.ssh/deploy_key -p "${{ secrets.VPS_PORT || 22 }}" "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" "whoami"

      - name: Upload project to VPS (scp)
        shell: bash
        run: |
          set -euo pipefail
          port="${{ secrets.VPS_PORT || 22 }}"
          host="${{ secrets.VPS_HOST }}"
          user="${{ secrets.VPS_USER }}"
          target="${{ secrets.VPS_APP_DIR }}"

          ssh -o IdentitiesOnly=yes -i ~/.ssh/deploy_key -p "$port" "$user@$host" "mkdir -p '$target'"

          paths=(
            app.py
            models.py
            requirements.txt
            babel.cfg
            create_users.py
            recommender.py
            users.json
            static
            templates
            translations
            Dockerfile.prod
            docker-compose.prod.yml
            .dockerignore
          )

          existing=()
          missing=()
          for p in "${paths[@]}"; do
            if [[ -e "$p" ]]; then
              existing+=("$p")
            else
              missing+=("$p")
            fi
          done

          if (( ${#missing[@]} )); then
            echo "Skipping missing paths: ${missing[*]}"
          fi
          if (( ${#existing[@]} == 0 )); then
            echo "No deploy artifacts found in workspace; aborting."
            exit 1
          fi

          scp -P "$port" -o IdentitiesOnly=yes -i ~/.ssh/deploy_key -r \
            "${existing[@]}" \
            "$user@$host:$target/"

      - name: Deploy on VPS (docker compose)
        shell: bash
        run: |
          set -euo pipefail
          port="${{ secrets.VPS_PORT || 22 }}"
          host="${{ secrets.VPS_HOST }}"
          user="${{ secrets.VPS_USER }}"
          target="${{ secrets.VPS_APP_DIR }}"

          # Write .env locally from secret, then upload it (avoids quoting/base64 issues on the VPS).
          # If APP_ENV_B64 is not actually base64, fall back to treating it as plain text.
          if printf "%s" "${{ secrets.APP_ENV_B64 }}" | base64 -d --ignore-garbage > .env 2>/dev/null; then
            echo ".env created from APP_ENV_B64 (base64)"
          else
            printf "%s" "${{ secrets.APP_ENV_B64 }}" > .env
            echo ".env created from APP_ENV_B64 (plain text fallback)"
          fi

          scp -P "$port" -o IdentitiesOnly=yes -i ~/.ssh/deploy_key .env "$user@$host:$target/.env"

          ssh -o IdentitiesOnly=yes -i ~/.ssh/deploy_key -p "$port" "$user@$host" "cd '$target' && docker compose -f docker-compose.prod.yml up -d --build"
