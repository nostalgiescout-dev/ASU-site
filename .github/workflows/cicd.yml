name: "CI/CD: test then deploy"

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:
concurrency:
  group: cicd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Smoke check (compile)
        run: |
          python -m compileall -q .

  deploy:
    needs: [test]
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare SSH
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          # Use OpenSSH client directly (avoids key-format parsing issues in some SCP/SSH actions).
          printf "%s" "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          sed -i 's/\r$//' ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          # Trust the server host key for this run (prevents interactive prompt).
          ssh-keyscan -p "${{ secrets.VPS_PORT || 22 }}" -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

          echo "Key fingerprint (sanity check):"
          ssh-keygen -yf ~/.ssh/deploy_key | ssh-keygen -lf -

          echo "SSH auth check:"
          ssh -o IdentitiesOnly=yes -i ~/.ssh/deploy_key -p "${{ secrets.VPS_PORT || 22 }}" "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" "whoami"

      - name: Upload project to VPS (scp)
        shell: bash
        run: |
          set -euo pipefail
          port="${{ secrets.VPS_PORT || 22 }}"
          host="${{ secrets.VPS_HOST }}"
          user="${{ secrets.VPS_USER }}"
          target="${{ secrets.VPS_APP_DIR }}"

          ssh -o IdentitiesOnly=yes -i ~/.ssh/deploy_key -p "$port" "$user@$host" "mkdir -p '$target'"

          scp -P "$port" -o IdentitiesOnly=yes -i ~/.ssh/deploy_key -r \
            app.py models.py requirements.txt babel.cfg create_users.py recommender.py users.json \
            static templates translations Dockerfile.prod docker-compose.prod.yml .dockerignore \
            "$user@$host:$target/"

      - name: Deploy on VPS (docker compose)
        shell: bash
        run: |
          set -euo pipefail
          port="${{ secrets.VPS_PORT || 22 }}"
          host="${{ secrets.VPS_HOST }}"
          user="${{ secrets.VPS_USER }}"
          target="${{ secrets.VPS_APP_DIR }}"

          # Write .env on the VPS from base64 secret
          ssh -o IdentitiesOnly=yes -i ~/.ssh/deploy_key -p "$port" "$user@$host" "mkdir -p '$target' && cd '$target' && printf '%s' '${{ secrets.APP_ENV_B64 }}' | base64 -d --ignore-garbage > .env && docker compose -f docker-compose.prod.yml up -d --build"
